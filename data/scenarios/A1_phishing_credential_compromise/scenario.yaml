id: A1
title: Phishing leads to credential compromise and mailbox abuse
category: soc
build_first: true
description: A credential-phishing email impersonating Contoso IT reaches 3 users. j.smith clicks and submits credentials.
  The attacker signs in from a Dutch VPS after MFA push fatigue, creates a mail forwarding rule, and sends an internal
  phishing email to the finance team.
trigger:
  type: siem_alert
  alert_id: ALR-A1-001
agents_involved:
- triage
- siem
- identity
- threat_intel
- investigator
- response_planner
- reporter
timeline_utc:
- time: 08:52
  event: Phishing email delivered to j.smith, k.osei, p.garcia
- time: 09:07
  event: j.smith clicks link on WS-031
- time: 09:08
  event: Credentials submitted (POST)
- time: 09:39-09:40
  event: 2 MFA pushes denied, 3rd approved
- time: 09:40
  event: Attacker sign-in from NL
- time: 09:46
  event: Inbox forwarding rule created
- time: 09:52
  event: Internal phishing sent to 14 finance users
