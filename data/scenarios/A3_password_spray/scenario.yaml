id: A3
title: Password spray over legacy IMAP with one successful login
category: soc
build_first: false
description: An external IP sprays 26 accounts with two password rounds over legacy IMAP (no MFA). p.garcia's account
  succeeds in round 2 and the attacker reads 412 mail items.
trigger:
  type: siem_alert
  alert_id: ALR-A3-001
agents_involved:
- triage
- siem
- identity
- threat_intel
- investigator
- response_planner
- reporter
timeline_utc:
- time: 02:10
  event: 'Round 1: every account fails'
- time: 02:18
  event: Round 2 begins
- time: 02:20
  event: Alert fires
- time: 02:21
  event: p.garcia succeeds via IMAP (MFA not applied)
- time: 02:23
  event: 412 mail items accessed
files:
  alerts.json: Alerts that trigger or accompany the scenario
  siem_events.jsonl: SIEM log events (auth, sign-in, email, proxy, DNS, firewall, AD audit)
  edr_telemetry.jsonl: EDR telemetry (process, network, file, registry, device, detections)
  ad_objects.json: Scenario-specific AD view (overrides merged over data/environment/ad_users.json)
  ti_indicators.json: Threat-intel lookups available for this scenario
  soar_case.json: SOAR case (if any)
  tickets.json: ITSM tickets / changes (if any)
  expected.yaml: Ground truth used by evals - never give this file to agents
counts:
  siem_events: 92
  edr_events: 11
  alerts: 1
